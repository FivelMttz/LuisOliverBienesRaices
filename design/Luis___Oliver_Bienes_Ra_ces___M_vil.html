                    onClick={() => setShowExtraChips(!showExtraChips)}
                    className="shrink-0 w-8 h-8 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface flex items-center justify-center hover:bg-surface-container-low"
                  >
                    <span className="material-symbols-outlined text-title-md" aria-hidden="true">
                      {showExtraChips ? 'expand_less' : 'expand_more'}
                    </span>
                  </button>
                </div>

                {showExtraChips && (
                  <div className="flex flex-wrap items-center gap-2">
                    {EXTRA_CHIPS.map((chip) => {
                      const isActive = selectedType === chip.id;
                      return (
                        <button
                          key={chip.id}
                          type="button"
                          aria-pressed={isActive}
                          onClick={() => {
                            setSelectedType(chip.id);
                            setVisibleCount(3);
                          }}
                          className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 transition-colors duration-state-change ease-state-change ${
                            isActive
                              ? 'border-primary-container bg-primary-container text-on-primary-container'
                              : 'border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low'
                          }`}
                        >
                          <span className="material-symbols-outlined text-body-lg" aria-hidden="true">{chip.icon}</span>
                          <span data-design-text-token="label-md" className="font-body text-label-md">{chip.label}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Horizontal Property Cards */}
              <div className="flex flex-col gap-3">
                {displayedProperties.map((prop) => {
                  const isFav = !!favorites[prop.id];
                  return (
                    <article
                      key={prop.id}
                      data-component-id={`card-mobile-property-${prop.id}`}
                      data-component-type="card"
                      data-component-variant="elevated"
                      className="bg-surface-container-lowest rounded-lg border border-outline-variant/60 overflow-hidden flex items-stretch gap-3 p-2"
                    >
                      <div className="relative w-[124px] min-h-[104px] shrink-0 rounded-md overflow-hidden bg-surface-container-high">
                        <img
                          src={prop.imagen}
                          alt={prop.alt}
                          className="w-full h-full object-cover"
                        />
                        <button
                          type="button"
                          onClick={() => toggleFavorite(prop.id)}
                          aria-label={isFav ? `Quitar ${prop.zona} de favoritos` : `Guardar ${prop.zona} en favoritos`}
                          className="absolute top-2 right-2 w-7 h-7 rounded-full bg-primary/45 text-on-primary flex items-center justify-center"
                        >
                          <span
                            className="material-symbols-outlined text-body-lg"
                            style={isFav ? { fontVariationSettings: "'FILL' 1" } : undefined}
                            aria-hidden="true"
                          >
                            favorite
                          </span>
                        </button>
                      </div>

                      <div className="flex-1 min-w-0 py-1 flex flex-col justify-between gap-1.5">
                        <div className="flex flex-col gap-1">
                          <span className="self-start rounded-full bg-surface-container-low border border-outline-variant/50 px-2.5 py-0.5">
                            <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface-variant">{prop.tipo}</span>
                          </span>
                          <h3 data-design-text-token="title-md" className="font-body text-title-md text-on-surface">
                            {prop.zona}
                          </h3>
                          <p data-design-text-token="body-md" className="font-body text-body-md text-on-surface tabular-nums">
                            {formatMXN(prop.precio)}
                          </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 text-on-surface-variant">
                          {prop.recamaras !== null && (
                            <span className="inline-flex items-center gap-1">
                              <span className="material-symbols-outlined text-body-md" aria-hidden="true">bed</span>
                              <span data-design-text-token="label-sm" className="font-body text-label-sm tabular-nums">{prop.recamaras}</span>
                            </span>
                          )}
                          {prop.banos !== null && (
                            <span className="inline-flex items-center gap-1">
                              <span className="material-symbols-outlined text-body-md" aria-hidden="true">bathtub</span>
                              <span data-design-text-token="label-sm" className="font-body text-label-sm tabular-nums">{prop.banos}</span>
                            </span>
                          )}
                          <span className="inline-flex items-center gap-1">
                            <span className="material-symbols-outlined text-body-md" aria-hidden="true">square_foot</span>
                            <span data-design-text-token="label-sm" className="font-body text-label-sm tabular-nums">{prop.m2} m²</span>
                          </span>
                        </div>
                      </div>

                      <div className="flex items-center pr-1">
                        <button
                          type="button"
                          aria-label={`Ver detalle de ${prop.zona}`}
                          className="w-8 h-8 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface flex items-center justify-center hover:bg-surface-container-low"
                        >
                          <span className="material-symbols-outlined text-title-md" aria-hidden="true">arrow_forward</span>
                        </button>
                      </div>
                    </article>
                  );
                })}
              </div>

              {hasMore && (
                <div className="flex justify-center pt-1">
                  <button
                    data-component-id="button-mobile-ver-mas"
                    data-component-type="button"
                    data-component-variant="with-icon"
                    type="button"
                    onClick={() => setVisibleCount((prev) => prev + 3)}
                    className="w-full max-w-[260px] inline-flex items-center justify-center gap-2 rounded-md bg-surface-container-lowest text-on-surface border border-outline-variant px-6 py-2.5 hover:bg-surface-container-low"
                  >
                    <span data-design-text-token="label-lg" className="font-body text-label-lg">Ver más propiedades</span>
                    <span className="material-symbols-outlined text-title-md" aria-hidden="true">expand_more</span>
                  </button>
                </div>
              )}
            </section>

            {/* QUIERO VENDER MI PROPIEDAD BANNER */}
            <section id="vender" className="flex flex-col gap-3">
              <div className="relative rounded-xl overflow-hidden border border-outline-variant/60 min-h-[156px] p-5 flex items-center justify-between gap-4">
                <img
                  src="https://lh3.googleusercontent.com/aida/ALJJyrAkWjKoKdUCGM7kTXUCirwiy8lhe5560RffnNJYa2SqALbxtu-AGGxcyVOxmrASHyERw1AhXs50ZV84YXngC6YIqR8GGyOtpYTlXNnd5YuBgnwCV004eEulbyavM7kPzPdxyTTH0-IWHEMmW1KXhS-iAFtYAQfwCu6V-5GQ2BYIVVD8ggRoaAxP96UAyQwVLXY_J7s9T-Qfds-2mUQP40ZzFaNUlbvG5hPcvVDOecwOwNbwkyPBPh8HM3cH"
                  alt="Residencia de cantera en San Luis Potosí"
                  className="absolute inset-0 w-full h-full object-cover object-center"
                />
                <div className="absolute inset-0 bg-gradient-to-r from-primary/85 via-primary/70 to-primary/45"></div>

                <div className="relative z-10 flex flex-col gap-1.5 max-w-[190px]">
                  <h2 data-design-text-token="headline-md" className="font-headline text-headline-md text-on-primary text-balance">
                    Quiero vender mi propiedad
                  </h2>
                  <p data-design-text-token="label-sm" className="font-body text-label-sm text-on-primary/90 text-pretty">
                    Déjanos tus datos y te contactamos a la brevedad.
                  </p>
                </div>

                <button
                  data-component-id="button-mobile-iniciar-registro"
                  data-component-type="button"
                  data-component-variant="secondary"
                  type="button"
                  onClick={() => setShowSellerForm(!showSellerForm)}
                  className="relative z-10 shrink-0 inline-flex items-center gap-1.5 rounded-md bg-surface-container-lowest text-on-surface px-3.5 py-2.5 hover:bg-surface-container-low"
                >
                  <span className="material-symbols-outlined text-title-md" aria-hidden="true">sell</span>
                  <span data-design-text-token="label-md" className="font-body text-label-md">Iniciar registro</span>
                  <span className="material-symbols-outlined text-title-md" aria-hidden="true">arrow_forward</span>
                </button>
              </div>

              {showSellerForm && (
                <form
                  onSubmit={handleSellerSubmit}
                  className="bg-surface-container-lowest rounded-lg border border-outline-variant p-4 flex flex-col gap-3"
                >
                  {sellerSubmitted ? (
                    <p data-design-text-token="body-md" className="font-body text-body-md text-on-surface text-center py-2">
                      Registro enviado. Un asesor en San Luis Potosí se pondrá en contacto contigo.
                    </p>
                  ) : (
                    <>
                      <label className="flex flex-col gap-1">
                        <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Nombre</span>
                        <input
                          type="text"
                          required
                          value={sellerName}
                          onChange={(e) => setSellerName(e.target.value)}
                          placeholder="Tu nombre"
                          className="w-full rounded-full border border-outline-variant bg-surface-container-low px-4 py-2 text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:outline-none"
                        />
                      </label>
                      <label className="flex flex-col gap-1">
                        <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Teléfono</span>
                        <input
                          type="tel"
                          inputMode="numeric"
                          required
                          value={sellerPhone}
                          onChange={(e) => setSellerPhone(e.target.value)}
                          placeholder="444 000 0000"
                          className="w-full rounded-full border border-outline-variant bg-surface-container-low px-4 py-2 text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:outline-none"
                        />
                      </label>
                      <label className="flex flex-col gap-1">
                        <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Zona en San Luis Potosí</span>
                        <input
                          type="text"
                          required
                          value={sellerZona}
                          onChange={(e) => setSellerZona(e.target.value)}
                          placeholder="Ej. Lomas, Tangamanga, Himalaya..."
                          className="w-full rounded-full border border-outline-variant bg-surface-container-low px-4 py-2 text-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:outline-none"
                        />
                      </label>
                      <button
                        type="submit"
                        className="w-full rounded-md bg-primary-container text-on-primary-container py-2.5 text-label-lg"
                      >
                        Enviar información
                      </button>
                    </>
                  )}
                </form>
              )}
            </section>

            {/* CONTÁCTANOS */}
            <section id="contacto" className="flex flex-col gap-3 pb-4">
              <div className="flex flex-col gap-0.5">
                <h2 data-design-text-token="headline-md" className="font-headline text-headline-md text-on-surface">
                  Contáctanos
                </h2>
                <p data-design-text-token="body-md" className="font-body text-body-md text-on-surface-variant">
                  Resuelve tus dudas y recibe asesoría personalizada.
                </p>
              </div>

              <div className="grid grid-cols-4 gap-2 items-stretch">
                <a
                  href="#whatsapp"
                  data-component-id="card-mobile-whatsapp"
                  data-component-type="card"
                  data-component-variant="interactive"
                  className="h-full bg-surface-container-lowest border border-outline-variant rounded-md py-3 px-1 flex flex-col items-center justify-center gap-1.5 hover:bg-surface-container-low"
                >
                  <span className="material-symbols-outlined text-headline-md text-on-surface" aria-hidden="true">chat</span>
                  <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">WhatsApp</span>
                </a>

                <a
                  href="tel:+524441234567"
                  data-component-id="card-mobile-phone"
                  data-component-type="card"
                  data-component-variant="interactive"
                  className="h-full bg-surface-container-lowest border border-outline-variant rounded-md py-3 px-1 flex flex-col items-center justify-center gap-1.5 hover:bg-surface-container-low"
                >
                  <span className="material-symbols-outlined text-headline-md text-on-surface" aria-hidden="true">call</span>
                  <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Llamar</span>
                </a>

                <a
                  href="mailto:contacto@luisoliver.mx"
                  data-component-id="card-mobile-email"
                  data-component-type="card"
                  data-component-variant="interactive"
                  className="h-full bg-surface-container-lowest border border-outline-variant rounded-md py-3 px-1 flex flex-col items-center justify-center gap-1.5 hover:bg-surface-container-low"
                >
                  <span className="material-symbols-outlined text-headline-md text-on-surface" aria-hidden="true">mail</span>
                  <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Correo</span>
                </a>

                <a
                  href="#ubicacion"
                  data-component-id="card-mobile-location"
                  data-component-type="card"
                  data-component-variant="interactive"
                  className="h-full bg-surface-container-lowest border border-outline-variant rounded-md py-3 px-1 flex flex-col items-center justify-center gap-1.5 hover:bg-surface-container-low"
                >
                  <span className="material-symbols-outlined text-headline-md text-on-surface" aria-hidden="true">location_on</span>
                  <span data-design-text-token="label-sm" className="font-body text-label-sm text-on-surface">Ubicación</span>
                </a>
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>


</body></html>
